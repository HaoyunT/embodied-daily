name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from logs/stdout.log, logs/stderr.log or the Actions log. Remove any keys first.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and whether you run locally (launchd / manual) or on GitHub Actions.
    validations:
      required: true
